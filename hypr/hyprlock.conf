# Halo — blokada ekranu (hyprlock 0.9)
# Uruchamiana skrótem Super+L: hyprlock --config ~/.config/halo/hypr/hyprlock.conf
# Dokumentacja: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Kolory i wymiary z sekcji 10 specyfikacji. Pusty „monitor” = każdy monitor.
# Uwaga: „##” w tekście to znak „#” (pojedynczy # zaczyna komentarz).

general {
    hide_cursor = true
    # Enter z pustym polem nic nie robi
    ignore_empty_input = true
}

# Tło: kolor tła Halo
background {
    monitor =
    color = rgb(0e1013)
}

# Aureola: pierścień o promieniu 240 px, obrys w kolorze akcentu z kryciem 35%
shape {
    monitor =
    size = 480, 480
    rounding = -1
    color = rgba(0, 0, 0, 0)
    border_size = 2
    border_color = rgba(244, 213, 141, 0.35)
    position = 0, 0
    halign = center
    valign = center
}

# Zegar nad polem hasła
label {
    monitor =
    text = $TIME
    color = rgb(e8eaed)
    font_size = 48
    font_family = Geist
    position = 0, 70
    halign = center
    valign = center
}

# Pole hasła: 260 × 48 px, w pełni zaokrąglone (jak pole wyszukiwania launchera)
input-field {
    monitor =
    size = 260, 48
    rounding = -1
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.10)
    inner_color = rgb(161a1f)
    font_color = rgb(e8eaed)
    font_family = Geist
    # Podpowiedź: nazwa użytkownika w kolorze wyciszonym
    placeholder_text = <span foreground="##8a9099">$USER</span>
    fade_on_empty = false
    dots_size = 0.2
    dots_spacing = 0.3
    # Akcent podczas sprawdzania hasła, czerwonawy wariant przy błędzie
    check_color = rgb(f4d58d)
    fail_color = rgb(f2a7a0)
    fail_text = $FAIL
    capslock_color = rgb(9ed0ff)
    position = 0, -20
    halign = center
    valign = center
}
