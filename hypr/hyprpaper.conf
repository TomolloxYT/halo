# Halo — tapeta (hyprpaper 0.8)
# Uruchamiana z hypr/hyprland.lua: hyprpaper --config ~/.config/halo/hypr/hyprpaper.conf
# Dokumentacja: https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/

# Bez napisu Hyprlanda na tapecie
splash = false

# Pusty monitor = ta sama tapeta na każdym monitorze (także zewnętrznym)
wallpaper {
    monitor =
    path = ~/.config/halo/assets/wallpaper.png
    fit_mode = cover
}
